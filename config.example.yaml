# Voice Chat DM Assistant — canonical configuration.
# Copy to config.yaml. Every AI endpoint is role-based; no model names in code.

server:
  host: 0.0.0.0
  port: 8760
  https_enabled: false          # true → serve on https:// (needs cert_file/key_file)
  cert_file: null               # e.g. ./certs/fullchain.pem  (mkcert or Let's Encrypt)
  key_file: null                # e.g. ./certs/privkey.pem

project:
  path: ./my-campaign            # worldbuilding folder to index
  name: My Campaign

models:
  synthesis:                     # REQUIRED: cards, enrichment, scene summaries
    provider: remote             # remote = base_url below; local = desktop bridge
    base_url: http://localhost:8081/v1
    api_key: null                # optional; enter it during setup if required
    model_id: minicpm5-2b
    # The card tier runs a multi-call agentic loop; a slow model (e.g. the 35b)
    # exceeds agent_timeout_s and errors. Use a fast model for responsive cards,
    # or keep a slow model and raise agent_timeout_s for quality-over-latency.
    extra_body: { enable_thinking: false }   # free-form JSON; disable thinking for fast models
  fast:                          # optional: background monitoring/prediction
    base_url: http://localhost:8081/v1
    api_key: null
    model_id: minicpm5-2b
    extra_body: { enable_thinking: false }
  vision:                        # optional: init-time image captioning
    # base_url: ...
    # api_key: ...
    # model_id: ...
    enabled: false
  stt:                           # streaming-only: SimulStreaming whisper TCP server
    stream_host: 127.0.0.1      # local = provisioned sidecar; remote = your server's host
    stream_port: 43007          # whisper_online_server.py listen port
  embeddings:
    provider: local              # local | endpoint
    model_id: BAAI/bge-small-en-v1.5

orchestration:
  max_concurrent: 3              # keep <= backend --parallel slots
  job_timeout_s: 60.0          # must exceed agent.agent_timeout_s

stt_pipeline:
  sample_rate: 16000             # transcription target rate
  silence_ms: 500                # end-of-utterance threshold (low to protect the 5s voice->transcript budget)
  min_utterance_ms: 400
  max_chunk_s: 25

# Predictive-retrieval staging ("Predictive RAG"): the transcript monitor
# predicts likely-next entities and their excerpts are pre-fetched into a small
# RAM LRU so a real turn pulls already-embedded context (zero retrieval latency
# on the answer path). Advisory only; a miss is a no-op fallback.
staging:
  enabled: true
  ttl_s: 120.0                   # staged excerpts expire; re-fetch is cheap
  max_entries: 32                # RAM LRU bound
  prefetch_k: 4                  # excerpts stored per predicted entity
  max_predicted: 6               # cap predictions prefetched per monitor tick
  max_inject_chars: 6000         # ceiling on the injected staged block

openjev:                        # required: sole binary deploy/wait trigger gate
  provider: remote               # remote = base_url below; local = JEV sidecar
  base_url: http://127.0.0.1:8199  # openjev-serve /score endpoint
  threshold: 0.5                 # P(deploy) at or above this deploys a worker
  timeout_s: 3.0                 # per scoring call; failures fail closed to wait
  recent_n: 8                    # transcript lines in the gate state window
  debounce_s: 30.0               # redeploy suppression window in seconds (0 off)

# Separate from the locked v39 gate. Rolling review: every new finalized
# block advances the review context and schedules eligible PRIOR blocks for
# bounded background re-scoring — confident timing included. It never
# delays, dispatches, or duplicates cards.
attribution_review:
  enabled: true
  min_prob: 0.75                 # winners below this are labeled low-confidence
  max_pending: 1                 # concurrent scorer calls (waiters queue, none dropped)
  recent_n: null                 # null = all retained preceding transcript
  following_n: null              # null = all retained following transcript
  max_age_blocks: 12             # blocks older than this stop being rescored
  max_age_s: 300.0               # wall-clock stop horizon per block
  initial_reviews: 2             # rolling passes per block as context arrives
  max_total_reviews: 6           # lifetime passes per block (>= initial_reviews)
  max_candidates: 6              # member options offered per review
  history_len: 8                 # retained score distributions / history entries
  review_timeout_s: 5.0          # per-pass scorer timeout (failures change nothing)
  low_confidence_below: 0.6      # stability-phase revisit threshold
  unstable_window: 3             # recent scores scanned for winner changes

discord:
  token: null                    # enter the bot token during setup
  guild_id: "000000000000000000"   # the server; Familiar follows the DM within it
  dm_user_id: "000000000000000000" # your Discord user ID — Familiar joins your VC
  channel_id: null                 # optional: pin a specific voice channel
  self_mute: true
  self_deaf: false                 # MUST be false to receive audio

desktop:                         # local-provider endpoints (Electron shell)
  enabled: false                 # true when running inside the AppImage shell
  bridge_url: http://127.0.0.1:8791   # local synthesis bridge (OpenAI dialect)
  jev_local_url: http://127.0.0.1:8299  # local JEV sidecar (/score + /health)
